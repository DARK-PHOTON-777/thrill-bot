[build]
	command = "node netlify/fetch.js && npm run build --prefix web"
	publish = "web/dist"

[dev]
	framework = "#custom"
	command = "npm run dev --prefix web"
	targetPort = 5173
	port = 8888

[functions]
	directory = "netlify/functions"
	node_bundler = "esbuild"
	external_node_modules = ["pino", "pino-worker"]

[[redirects]]
	from = "/api/*"
	to = "/.netlify/functions/:splat"
	status = 200